spring:
  application:
    name: payment-ms
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP:payment-ms}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.challenge.payment.messaging
        spring.json.value.default.type: com.challenge.payment.messaging.OrderPlacedEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: record

app:
  rsa:
    private-key-path: ${RSA_PRIVATE_KEY_PATH:../local-keys/private/private-key.pem}
  payment:
    success-rate: ${PAYMENT_SUCCESS_RATE:0.85}
    processing-delay-ms: ${PAYMENT_PROCESSING_DELAY_MS:2000}
  kafka:
    topics:
      order-placed: ${KAFKA_TOPIC_ORDER_PLACED:order-placed}
      payment-processed: ${KAFKA_TOPIC_PAYMENT_PROCESSED:payment-processed}

logging:
  level:
    root: INFO
    com.challenge.payment: INFO
