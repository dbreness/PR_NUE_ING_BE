server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-ms
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:supersecretpassword}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP:order-ms}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.challenge.order.messaging
        spring.json.value.default.type: com.challenge.order.messaging.PaymentProcessedEvent
        spring.json.use.type.headers: false

app:
  kafka:
    topics:
      order-placed: ${KAFKA_TOPIC_ORDER_PLACED:order-placed}
      payment-processed: ${KAFKA_TOPIC_PAYMENT_PROCESSED:payment-processed}

logging:
  level:
    root: INFO
    com.challenge.order: INFO
